[tox]
envlist = passagemath

[testenv:.pkg]
passenv =
    CPATH
    LIBRARY_PATH

[testenv:passagemath]
usedevelop = True
extras = passagemath

passenv =
    CPATH
    LIBRARY_PATH

setenv =
    # For access to _doctest_environment.py
    PYTHONPATH=.

commands =
    python -c 'import sage.all__sagemath_schemes; import ecfactory'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.ec_chain.ec_chain_tests'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.pell_equation_solver.pell_equation_solver_test'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.complex_multiplication.complex_multiplication_tests'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.dupont_enge_morain.dupont_enge_morain_tests'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.cocks_pinch.cocks_pinch_tests'
    python -c 'import sage.all__sagemath_schemes; import ecfactory.bn_curves.bn_curves_tests'
