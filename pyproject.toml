[tool.poetry]
name = "ecfactory"
version = "0.1.0"
description = "A SageMath Library for Constructing Elliptic Curves"
authors = ["See AUTHORS file"]
license = "MIT"
readme = "readme.md"

[tool.poetry.dependencies]
python = "^3.7"

passagemath-schemes = { version = "^10.4", optional = true }
passagemath-symbolics = { version = "^10.4", optional = true }
passagemath-repl = { version = "^10.4", optional = true }

[tool.poetry.extras]
passagemath = ["passagemath-schemes", "passagemath-symbolics", "passagemath-repl"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"